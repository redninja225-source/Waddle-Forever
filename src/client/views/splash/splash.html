<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="../base.css" rel="stylesheet" type="text/css" media="screen"/>
    <link href="splash.css" rel="stylesheet" type="text/css" media="screen"/>
    <title>Waddle Forever</title>
  </head>
  <body class="splash-body">
    <main class="splash-container">
      <div class="back-bubble">
        <h1>Waddle Forever</h1>
        <p>How do you want to play today?</p>
      </div>

      <div class="mode-options">
        <div class="mode-option">
          <button id="main-mode" class="mode-button" type="button">
            <span class="mode-title">Main-Modern World</span>
          </button>
          <span class="mode-description">Play in your pinned island era</span>
        </div>
        <div class="mode-option">
          <button id="story-mode" class="mode-button" type="button">
            <span class="mode-title">Story Mode</span>
          </button>
          <span class="mode-description">Unlock eras through time</span>
        </div>
      </div>
    </main>
    <script src="splash-static.js" type="module"></script>
  </body>
</html>
