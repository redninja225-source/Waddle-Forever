<!DOCTYPE html>
<html>
  <head>
    <link href="timeline.css" rel="stylesheet" type="text/css" media="screen"/>
    <link href="../base.css" rel="stylesheet" type="text/css" media="screen"/>
  </head>
  <body>
    <div class="timeline-header">
      <div class="version-picker">
        <div class="version-description">
          Choose a day in the timeline!
          <br>
          WARNING: This timeline is a
          <br>
          work in progress! It will have errors
        </div>
        <div>
          <div>
            <label for="year">Year:</label>
            <select id="year">
              <option>2005</option>
              <option>2006</option>
              <option>2007</option>
              <option>2008</option>
              <option>2009</option>
              <option>2010</option>
              <option>2011</option>
              <option>2012</option>
              <option>2013</option>
              <option>2014</option>
              <option>2015</option>
              <option>2016</option>
              <option>2017</option>
            </select>
            <label for="month">Month:</label>
            <select id="month">
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>
          </div>
        </div>
        <div>
          <input type="radio" id="calendar-timeline" name="timeline-type" checked />
          <label for="calendar-timeline">Calendar</label>
          <input type="radio" id="list-timeline" name="timeline-type" />
          <label for="list-timeline">List</label>
        </div>
      </div>
    </div>
    <div class="timeline-controls">
      <div id="timeline-shop" class="timeline-shop" hidden>
        <div class="shop-title">NEXT ERA</div>
        <div id="shop-era" class="shop-era"></div>
        <div class="coin-icon"></div>
        <div id="shop-cost" class="shop-cost"></div>
        <div id="shop-coins" class="shop-coins"></div>
      </div>
      <div class="version-selected">
        Selected Date: <span id="selected-date"></span>
      </div>
      <button id="unlock-all" class="unlock-all">UNLOCK ALL</button>
      <button id="reset-progress" class="reset-progress">RESET PROGRESS</button>
    </div>
    <div id="reset-modal" class="reset-modal" hidden>
      <div class="reset-dialog">
        <div class="reset-title">RESET PROGRESS</div>
        <div class="reset-message">This resets the current penguin and timeline progression. Type ICONFIRM to continue.</div>
        <input id="reset-confirm" class="reset-confirm" type="password" autocomplete="off" />
        <div id="reset-error" class="reset-error"></div>
        <div class="reset-actions">
          <button id="reset-cancel" type="button">Cancel</button>
          <button id="reset-submit" type="button">Reset</button>
        </div>
      </div>
    </div>
    <div id="unlock-modal" class="reset-modal" hidden>
      <div class="reset-dialog">
        <div class="reset-title">DEBUG UNLOCK</div>
        <div class="reset-message">Type ICONFIRM to unlock every timeline era.</div>
        <input id="unlock-confirm" class="reset-confirm" type="password" autocomplete="off" />
        <div id="unlock-error" class="reset-error"></div>
        <div class="reset-actions">
          <button id="unlock-cancel" type="button">Cancel</button>
          <button id="unlock-submit" type="button">Unlock</button>
        </div>
      </div>
    </div>
    <div id="timeline">
    </div>
    <div id="as3-footer"></div>
    <script src="timeline-static.js" type="module"></script>
  </body>
</html>
