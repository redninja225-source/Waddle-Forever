name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Check tag matches package.json version
      id: ver
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = "push" ]; then
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
        fi

  create-release:
    runs-on: ubuntu-latest
    needs: verify-version
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Determine tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v${{ needs.verify-version.outputs.version }}" >> "$GITHUB_OUTPUT"
        fi
    - name: Create release
      run: gh release create "${{ steps.tag.outputs.tag }}" --repo ${{ github.repository }} --title "${{ steps.tag.outputs.tag }}" --generate-notes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: [verify-version, create-release]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js, NPM and Yarn
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Restore dependencies
      run: yarn install

    - name: Build for Linux
      run: yarn build-packages && yarn build-tsc && yarn electron-builder build --linux --x64 --publish always

  build-windows:
    runs-on: windows-latest
    needs: [verify-version, create-release]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js, NPM and Yarn
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Restore dependencies
      run: yarn install

    - name: Build for Windows
      run: yarn build-packages && yarn build-tsc && yarn electron-builder build --win --x64 --publish always

  build-media:
    runs-on: ubuntu-latest
    needs: [verify-version, create-release]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js, NPM and Yarn
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Restore dependencies
      run: yarn install

    - name: Build media zips
      run: yarn build-media

    - name: Build media manifest
      run: npx tsx scripts/build-media-manifest.ts

    - name: Upload media zips to release
      run: |
        VERSION="${{ needs.verify-version.outputs.version }}"
        for file in zip/*-${VERSION}.zip; do
          name=$(basename "$file" | sed "s/-${VERSION}\.zip/.zip/")
          gh release upload "${{ needs.create-release.outputs.tag }}" "$file#$name" --clobber
        done
        gh release upload "${{ needs.create-release.outputs.tag }}" zip/media-manifest.json --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
